name: "Préparer le projet"
description: "Installe uv et Python 3.13, puis les dépendances verrouillées, avec le cache uv."

runs:
  using: "composite"
  steps:
    - name: "Préparer Python et uv"
      uses: "astral-sh/setup-uv@v10.2.0"
      with:
        python-version: "3.13"
        enable-cache: true

    - name: "Installer les dépendances verrouillées"
      run: "uv sync --locked"
      shell: "bash"
