name: "CI J2"

"on":
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: "CI (${{ matrix.check }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: "lint"
            command: "uv run ruff check ."
          - check: "format"
            command: "uv run ruff format --check ."
          - check: "tests"
            command: >-
              uv run pytest tests/unit tests/integration -v
              --cov=supermarket_receipt_api --cov-branch
              --cov-report=term-missing --cov-report=html:htmlcov
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Préparer le projet"
        uses: "./.github/actions/preparer"

      - name: "Exécuter le contrôle"
        id: "check"
        run: "${{ matrix.command }}"

      - name: "Conserver le rapport de couverture"
        if: >-
          !cancelled() && matrix.check == 'tests' &&
          (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        uses: "actions/upload-artifact@v7.0.1"
        with:
          name: "couverture"
          path: "htmlcov/"
          if-no-files-found: "error"
          retention-days: 7

  build:
    needs: "checks"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Préparer le projet"
        uses: "./.github/actions/preparer"

      - name: "Construire le paquet"
        run: "uv build"

      - name: "Conserver le paquet"
        uses: "actions/upload-artifact@v7.0.1"
        with:
          name: "distribution"
          path: "dist/"
          if-no-files-found: "error"
          retention-days: 7

  commenter:
    needs: ["checks", "build"]
    if: github.event_name == 'pull_request'
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    permissions:
      pull-requests: "write"
    steps:
      - name: "Commenter la PR"
        run: 'gh pr comment "$PR" --body "CI verte : rapport et paquet dans $RUN_URL"'
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          PR: "${{ github.event.pull_request.number }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
